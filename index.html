<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pandayan - Liham Pahintulot Portal Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --burgundy: #800000;
      --burgundy-dark: #5a0000;
      --yellow: #ffd700;
      --white: #ffffff;
      --gray-bg: #f4f6f9;
      --text-dark: #333333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: linear-gradient(135deg, var(--burgundy) 0%, var(--burgundy-dark) 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }

    .login-card { background: var(--white); width: 100%; max-width: 400px; padding: 35px 30px; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); border-top: 6px solid var(--yellow); text-align: center; }
    .brand-title { color: var(--burgundy); font-size: 24px; font-weight: 800; letter-spacing: 1px; margin-bottom: 4px; }
    .brand-subtitle { font-size: 13px; color: #666; font-weight: 600; margin-bottom: 25px; text-transform: uppercase; }

    .form-group { margin-bottom: 18px; text-align: left; }
    .form-group label { display: block; font-size: 11px; font-weight: 700; color: #555; margin-bottom: 6px; text-transform: uppercase; }
    .input-wrapper { position: relative; }
    .input-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--burgundy); font-size: 14px; }
    .form-control { width: 100%; padding: 10px 12px 10px 38px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; transition: 0.3s; }
    .form-control:focus { border-color: var(--burgundy); outline: none; box-shadow: 0 0 5px rgba(128,0,0,0.2); }

    .btn-submit { width: 100%; background: var(--burgundy); color: var(--white); border: none; padding: 12px; border-radius: 6px; font-weight: 800; font-size: 13px; cursor: pointer; transition: 0.3s; text-transform: uppercase; margin-top: 10px; }
    .btn-submit:hover { background: var(--burgundy-dark); }
    
    .register-link { margin-top: 20px; font-size: 12px; color: #555; }
    .register-link a { color: var(--burgundy); font-weight: 700; text-decoration: none; cursor: pointer; }
    .register-link a:hover { text-decoration: underline; }

    /* Modal Styling */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
    .modal.active { display: flex; }
    .modal-content { background: var(--white); border-radius: 8px; width: 100%; max-width: 420px; border: 2px solid var(--burgundy); overflow: hidden; animation: fadeIn 0.3s ease-in-out; }
    .modal-header { background: var(--burgundy); color: var(--white); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 15px; color: var(--yellow); font-weight: 700; }
    .modal-close { color: var(--white); font-size: 20px; cursor: pointer; }
    .modal-body { padding: 20px; text-align: left; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand-title">PANDAYAN</div>
    <div class="brand-subtitle">Liham Pahintulot Portal</div>

    <form id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="username" class="form-control" placeholder="Isulat ang username" required>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" class="form-control" placeholder="Isulat ang password" required>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; font-size: 12px; color: #555;">
        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
          <input type="checkbox" id="rememberMe"> Tandaan ako (Remember Me)
        </label>
      </div>

      <button type="submit" class="btn-submit" id="btnLogin">LOG IN</button>
    </form>

    <div class="register-link">
      Wala pang account? <a onclick="openRegisterModal()">Mag-register dito</a>
    </div>
  </div>

  <!-- REGISTER MODAL -->
  <div class="modal" id="registerModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Account Registration</h3>
        <span class="modal-close" onclick="closeRegisterModal()">&times;</span>
      </div>
      <form id="registerForm">
        <div class="modal-body">
          <div class="form-group">
            <label>Pangalan (Kapwa Name)</label>
            <input type="text" id="regKapwaName" class="form-control" style="padding-left:12px;" placeholder="Buong Pangalan" required>
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="regEmail" class="form-control" style="padding-left:12px;" placeholder="Email address" required>
          </div>
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="regUsername" class="form-control" style="padding-left:12px;" placeholder="Nais na Username" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="regPassword" class="form-control" style="padding-left:12px;" placeholder="Nais na Password" required>
          </div>
          <button type="submit" class="btn-submit" id="btnRegister" style="margin-top:5px;">I-SUBMIT REGISTRATION</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // PANIBAGONG WEB APP DEPLOYMENT URL
    const API_URL = "https://script.google.com/macros/s/AKfycbwhP1l-3TtFSTsrnJoVnA6VyfHHDZZlHWl3Obqc_my_661c9wJojis7sTn9_WkU7ZEf/exec";

    window.addEventListener('DOMContentLoaded', () => {
      // Automatic Login Check kapag may nakatagong session
      const stored = localStorage.getItem('pandayan_user') || sessionStorage.getItem('pandayan_user');
      if (stored) {
        window.location.href = 'dashboard.html';
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      btn.disabled = true;
      btn.innerText = 'PROSESO NG LOGIN...';

      const payload = {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      };

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'login', payload: payload })
        });
        const res = await response.json();

        if (res.success) {
          const remember = document.getElementById('rememberMe').checked;
          const userObj = JSON.stringify(res.user);
          if (remember) {
            localStorage.setItem('pandayan_user', userObj);
          } else {
            sessionStorage.setItem('pandayan_user', userObj);
          }
          window.location.href = 'dashboard.html';
        } else {
          alert(res.message);
        }
      } catch (err) {
        alert('Nagkaroon ng error sa pag-connect sa system: ' + err.toString());
      } finally {
        btn.disabled = false;
        btn.innerText = 'LOG IN';
      }
    });

    function openRegisterModal() {
      document.getElementById('registerForm').reset();
      document.getElementById('registerModal').classList.add('active');
    }

    function closeRegisterModal() {
      document.getElementById('registerModal').classList.remove('active');
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnRegister');
      btn.disabled = true;
      btn.innerText = 'ISINUSUMITE...';

      const payload = {
        kapwaName: document.getElementById('regKapwaName').value.trim(),
        email: document.getElementById('regEmail').value.trim(),
        username: document.getElementById('regUsername').value.trim(),
        password: document.getElementById('regPassword').value
      };

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'register', payload: payload })
        });
        const res = await response.json();
        alert(res.message);
        if (res.success) {
          closeRegisterModal();
        }
      } catch (err) {
        alert('Error sa registration: ' + err.toString());
      } finally {
        btn.disabled = false;
        btn.innerText = 'I-SUBMIT REGISTRATION';
      }
    });
  </script>
</body>
</html>
